name: Native Reliability
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: native-reliability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python -m pip install -r server/requirements.txt
      - run: python -m unittest discover -s server/tests -v
      - run: node --experimental-vm-modules --test scripts/tests/gps-data-integrity.test.mjs
      - run: node --test scripts/tests/service-worker.test.mjs
      - run: npm ci --prefix mobile --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix mobile -- --runInBand --silent
      - run: python scripts/validate_platform_docs.py
      - name: Validate Windows bootstrap syntax
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/server/start.ps1", [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
  native-core:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: swift test --package-path mobile-ios/TelemetryCore
