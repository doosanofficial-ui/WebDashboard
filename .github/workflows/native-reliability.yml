name: Native Reliability
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: native-reliability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python -m pip install -r server/requirements.txt
      - run: python -m unittest discover -s server/tests -v
      - run: node --experimental-vm-modules --test scripts/tests/gps-data-integrity.test.mjs
      - run: node --test scripts/tests/service-worker.test.mjs
      - run: npm ci --prefix mobile --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix mobile -- --runInBand --silent
      - run: python scripts/validate_platform_docs.py
      - name: Verify actual app help images and source provenance
        run: python scripts/verify_help_assets.py
      - name: Validate Windows bootstrap syntax
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/server/start.ps1", [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
  native-core:
    # Official Xcode 27 preview image; no runtime downloads or older fallback.
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Require Xcode, iOS SDK and runtime 27.x
        run: python3 scripts/verify_ios_lifecycle.py --check-toolchain
      - run: swift test --package-path mobile-ios/TelemetryCore
      - name: Verify telemetry coordinator source harness
        run: python3 scripts/verify_telemetry_model.py
      - name: Verify failure-atomic profile import control flow
        run: python3 scripts/verify_profile_import.py
      - name: Verify observed BLE profile selection
        run: python3 scripts/verify_ble_profile.py

  native-seed:
    outputs:
      seed_manifest_sha256: ${{ steps.seed.outputs.manifest_sha256 }}
    # One host build before any Simulator; shards never recompile or use an older SHA.
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Verify Seed artifact admission and failure contracts
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Build and qualify exact-input Seed within the original 240-second budget
        id: seed
        run: python3 scripts/verify_replay_seed.py --output "$RUNNER_TEMP/replay-seed"
      - name: Preserve qualified Seed and build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: replay-seed-${{ github.sha }}
          path: ${{ runner.temp }}/replay-seed
          if-no-files-found: error
          retention-days: 14

  native-replay-ui:
    needs: native-seed
    strategy:
      fail-fast: false
      matrix:
        group: [replay, layout, help, help-max-en, help-max-ko]
    # Official Xcode 27 preview image; no runtime downloads or older fallback.
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      SEED_MANIFEST_SHA256: ${{ needs.native-seed.outputs.seed_manifest_sha256 }}
    # Include isolated Simulator preparation/build plus the bounded 20-minute UI run.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Download exact-SHA qualified Seed
        uses: actions/download-artifact@v7
        with:
          name: replay-seed-${{ github.sha }}
          path: ${{ runner.temp }}/replay-seed
      - name: Require Xcode, iOS SDK and runtime 27.x
        run: python3 scripts/verify_ios_lifecycle.py --check-toolchain
      - name: Install XcodeGen
        run: |
          if ! brew list xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
      - name: Verify exact 31-test partition
        run: python3 -m unittest discover -s scripts/tests -p test_offline_replay_groups.py -v
      - name: Verify offline Replay on isolated Simulator
        run: python3 scripts/verify_offline_replay.py --group "${{ matrix.group }}" --seed-artifact "$RUNNER_TEMP/replay-seed" --seed-manifest-sha256 "$SEED_MANIFEST_SHA256" --result-directory "$RUNNER_TEMP/offline-replay"
      - name: Preserve offline UI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: offline-replay-${{ matrix.group }}-${{ github.sha }}
          path: ${{ runner.temp }}/offline-replay
          if-no-files-found: error
          retention-days: 14

  # Separate repeats of two layout tests; the unique full-suite aggregate is 31.
  native-se-viewport:
    needs: native-seed
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      SEED_MANIFEST_SHA256: ${{ needs.native-seed.outputs.seed_manifest_sha256 }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Download exact-SHA qualified Seed
        uses: actions/download-artifact@v7
        with:
          name: replay-seed-${{ github.sha }}
          path: ${{ runner.temp }}/replay-seed
      - name: Require Xcode, iOS SDK and runtime 27.x
        run: python3 scripts/verify_ios_lifecycle.py --check-toolchain
      - name: Check exact SE selection and separate re-execution count
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Install XcodeGen
        run: |
          if ! brew list xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
      - name: Re-execute two viewport tests on iPhone SE (3rd generation), iOS 27.x
        run: python3 scripts/verify_offline_replay.py --se-viewport --seed-artifact "$RUNNER_TEMP/replay-seed" --seed-manifest-sha256 "$SEED_MANIFEST_SHA256" --result-directory "$RUNNER_TEMP/se-viewport"
      - name: Preserve SE re-execution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: se-viewport-repeat-2-${{ github.sha }}
          path: ${{ runner.temp }}/se-viewport
          if-no-files-found: error
          retention-days: 14

  native-replay-ui-aggregate:
    if: always()
    needs: native-replay-ui
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all five UI group jobs to succeed
        env:
          UI_GROUP_RESULT: ${{ needs.native-replay-ui.result }}
        run: |
          if [ "$UI_GROUP_RESULT" != "success" ]; then
            echo "UI groups did not succeed: $UI_GROUP_RESULT" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: offline-replay-replay-${{ github.sha }}
          path: ui-results/replay
      - uses: actions/download-artifact@v7
        with:
          name: offline-replay-layout-${{ github.sha }}
          path: ui-results/layout
      - uses: actions/download-artifact@v7
        with:
          name: offline-replay-help-${{ github.sha }}
          path: ui-results/help
      - uses: actions/download-artifact@v7
        with:
          name: offline-replay-help-max-en-${{ github.sha }}
          path: ui-results/help-max-en
      - uses: actions/download-artifact@v7
        with:
          name: offline-replay-help-max-ko-${{ github.sha }}
          path: ui-results/help-max-ko
      - name: Require all 31 UI tests across five disjoint groups
        run: python3 scripts/verify_offline_replay.py --verify-groups ui-results

  native-app:
    # Official Xcode 27 preview image; no runtime downloads or older fallback.
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Require Xcode, iOS SDK and runtime 27.x
        run: python3 scripts/verify_ios_lifecycle.py --check-toolchain
      - name: Install XcodeGen
        run: |
          if ! brew list xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
      - name: Generate Xcode project
        working-directory: mobile-ios
        run: xcodegen generate --spec project.yml
      - name: Build iOS application
        working-directory: mobile-ios
        run: |
          xcodebuild -project Telemetry.xcodeproj \
            -scheme Telemetry \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=YES \
            build
