name: Replay Speed Diagnostic
on:
  push:
    branches:
      - diagnostic/replay-speed-setter-20261114
permissions:
  contents: read
jobs:
  seed:
    runs-on: xcode-27
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    outputs:
      seed_manifest_sha256: ${{ steps.seed.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@v7
      - name: Produce qualified synthetic Seed for this exact diagnostic SHA
        id: seed
        run: python3 scripts/verify_replay_seed.py --output "$RUNNER_TEMP/replay-seed"
      - uses: actions/upload-artifact@v7
        with:
          name: replay-speed-seed-${{ github.sha }}
          path: ${{ runner.temp }}/replay-seed
          if-no-files-found: error
          retention-days: 14
  active-rate:
    needs: seed
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      SEED_MANIFEST_SHA256: ${{ needs.seed.outputs.seed_manifest_sha256 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: replay-speed-seed-${{ github.sha }}
          path: ${{ runner.temp }}/replay-seed
      - run: python3 scripts/verify_ios_lifecycle.py --check-toolchain
      - run: |
          if ! brew list xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
      - name: Observe active playback rate selection and setter
        run: python3 scripts/verify_offline_replay.py --only-test replay-speed-diagnostic --seed-artifact "$RUNNER_TEMP/replay-seed" --seed-manifest-sha256 "$SEED_MANIFEST_SHA256" --result-directory "$RUNNER_TEMP/replay-speed-diagnostic"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: replay-speed-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/replay-speed-diagnostic
          if-no-files-found: warn
          retention-days: 14
